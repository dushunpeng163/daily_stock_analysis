name: 资金流测试

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: 调用资金流
        env:
          EM_PROXY_URL: ${{ secrets.EM_PROXY_URL }}
          EM_PROXY_KEY: ${{ secrets.EM_PROXY_KEY }}
        run: |
          python - <<'PY'
          from data_provider.fundamental_adapter import _fetch_stock_flow_via_proxy
          for market, code in (("sh", "601816"), ("sz", "000001"), ("sh", "600519")):
              print("PROXY_RESULT", code, _fetch_stock_flow_via_proxy(market, code))
          PY
