name: 资金流代理回归
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -q -r requirements.txt
      - name: Test real capital_flow path + proxy
        env:
          EM_PROXY_URL: ${{ secrets.EM_PROXY_URL }}
          EM_PROXY_KEY: ${{ secrets.EM_PROXY_KEY }}
          # 强制走配置，避免本地默认干扰
          FUNDAMENTAL_FETCH_TIMEOUT_SECONDS: "8"
          FUNDAMENTAL_STAGE_TIMEOUT_SECONDS: "20"
        run: |
          python - <<'PY'
          import os, logging
          logging.basicConfig(level=logging.INFO, format="%(asctime)s %(name)s | %(message)s")
          print("EM_PROXY set=", bool(os.getenv("EM_PROXY_URL")), bool(os.getenv("EM_PROXY_KEY")))

          from data_provider.base import DataFetcherManager
          from data_provider.fundamental_adapter import _fetch_stock_flow_via_proxy

          codes = ["300014", "300017", "SH600763", "SZ000661", "600519"]
          print("\n=== 1) proxy only ===")
          for code in codes:
              m = "sz" if code.replace("SZ","").replace("SH","").startswith(("0","3")) or code.upper().startswith("SZ") else "sh"
              c = "".join(ch for ch in code if ch.isdigit())
              if code.upper().startswith("SH"): m="sh"
              if code.upper().startswith("SZ"): m="sz"
              print("PROXY", code, _fetch_stock_flow_via_proxy(m, c, attempts=3))

          mgr = DataFetcherManager()
          print("\n=== 2) budget=0（模拟上游耗尽，必须走 Cloudflare）===")
          for code in codes:
              block = mgr.get_capital_flow_context(code, budget_seconds=0)
              sf = (block.get("data") or {}).get("stock_flow") if isinstance(block.get("data"), dict) else {}
              chain = block.get("source_chain") or []
              print("BUDGET0", code, "status=", block.get("status"), "stock_flow=", sf, "chain_tail=", chain[-2:] if chain else chain)

          print("\n=== 3) normal budget ===")
          for code in ("300014", "SH600763"):
              block = mgr.get_capital_flow_context(code, budget_seconds=12)
              sf = (block.get("data") or {}).get("stock_flow") if isinstance(block.get("data"), dict) else {}
              print("NORMAL", code, "status=", block.get("status"), "stock_flow=", sf, "chain=", block.get("source_chain"))

          # 断言：budget=0 时至少一半要有 stock_flow
          ok = 0
          for code in codes:
              block = mgr.get_capital_flow_context(code, budget_seconds=0)
              data = block.get("data") if isinstance(block.get("data"), dict) else {}
              sf = data.get("stock_flow") if isinstance(data, dict) else {}
              if isinstance(sf, dict) and sf.get("main_net_inflow") is not None:
                  ok += 1
          print(f"\nASSERT budget0 filled {ok}/{len(codes)}")
          if ok < max(1, len(codes)//2):
              raise SystemExit(f"proxy fallback failed: only {ok}/{len(codes)} filled")
          print("PASS")
          PY
