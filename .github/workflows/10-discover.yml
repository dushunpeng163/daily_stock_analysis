name: 选股发现

on:
  workflow_dispatch:
    inputs:
      strategies:
        description: '策略 id，逗号分隔'
        required: false
        default: 'momentum_quality,balanced_alpha'
      top_n:
        description: '每套策略取前 N'
        required: false
        default: '100'
      max_cards:
        description: '最终入选并做完整分析的数量'
        required: false
        default: '8'

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    # 与 00-daily-analysis 一致：设了 vars.RUNNER_LABEL=self-hosted 即在国内自建 runner 上跑（全市场扫描最依赖国内数据源）
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 设置 Python 环境（自建 runner）
        if: runner.environment == 'self-hosted'
        run: |
          VENV="$RUNNER_TOOL_CACHE/dsa-venv"
          if [ ! -x "$VENV/bin/python" ]; then python3 -m venv "$VENV"; fi
          echo "$VENV/bin" >> "$GITHUB_PATH"
          echo "DSA_VENV=$VENV" >> "$GITHUB_ENV"

      - name: 安装依赖
        run: |
          if [ -n "$DSA_VENV" ]; then
            STAMP="$DSA_VENV/.req.sha256"; CUR=$(sha256sum requirements.txt | cut -d' ' -f1)
            if [ -f "$STAMP" ] && [ "$(cat "$STAMP")" = "$CUR" ]; then echo "依赖未变化，跳过安装"; exit 0; fi
          fi
          pip install --upgrade pip
          pip install -r requirements.txt
          if [ -n "$DSA_VENV" ]; then echo "$CUR" > "$STAMP"; fi

      - name: 运行选股发现
        env:
          SCREENING_ENABLED: 'true'
          SCREEN_STRATEGIES: ${{ github.event.inputs.strategies || 'momentum_quality,balanced_alpha' }}
          SCREEN_TOP_N: ${{ github.event.inputs.top_n || '100' }}
          LLM_MAX_CANDIDATES: '200'
          SCREEN_ENRICH_MAX: '160'
          SCREEN_MAX_CARDS: ${{ github.event.inputs.max_cards || '8' }}
          REPORT_TYPE: ${{ vars.REPORT_TYPE || secrets.REPORT_TYPE || 'full' }}
          REPORT_LANGUAGE: ${{ vars.REPORT_LANGUAGE || secrets.REPORT_LANGUAGE || '' }}
          REPORT_SHOW_LLM_MODEL: 'false'
          SINGLE_STOCK_NOTIFY: 'false'
          MAX_WORKERS: '1'
          ENABLE_CHIP_DISTRIBUTION: 'false'
          REALTIME_SOURCE_PRIORITY: ${{ vars.REALTIME_SOURCE_PRIORITY || 'tencent,akshare_sina,efinance,akshare_em' }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          BOCHA_API_KEYS: ${{ secrets.BOCHA_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS }}
          LOG_LEVEL: INFO
          STOCK_LIST: ${{ vars.STOCK_LIST || secrets.STOCK_LIST }}
          # LLM：与 00-daily-analysis 同源。设了 LITELLM_MODEL（如 deepseek/deepseek-v4-flash）则优先，否则按 key 自动推断
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL || secrets.LITELLM_MODEL }}
          LITELLM_FALLBACK_MODELS: ${{ vars.LITELLM_FALLBACK_MODELS || secrets.LITELLM_FALLBACK_MODELS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_KEYS: ${{ secrets.DEEPSEEK_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_MODEL_FALLBACK: ${{ vars.GEMINI_MODEL_FALLBACK || 'gemini-3.6-flash' }}
          GEMINI_REQUEST_DELAY: '3.0'
          # 搜索服务未配置时，国内 runner 可用东财新闻+巨潮公告免费兜底
          FREE_INTEL_FALLBACK: ${{ vars.FREE_INTEL_FALLBACK || 'true' }}
          EM_PROXY_URL: ${{ secrets.EM_PROXY_URL }}
          EM_PROXY_KEY: ${{ secrets.EM_PROXY_KEY }}
          # 东财日K硬超时；超时后站内换新浪/腾讯，避免 Actions 挂死
          AKSHARE_HISTORY_CALL_TIMEOUT: '25'
          ACCOUNT_SIZE: ${{ vars.ACCOUNT_SIZE || '100000' }}
          DAILY_HISTORY_DAYS: '300'
          MARKET_STATE: ${{ vars.MARKET_STATE || 'unknown' }}
          # 长线体检参数：止损容忍度 / 回撤注意线 / 回撤警报线（小数）
          LONG_TERM_STOP_PCT: ${{ vars.LONG_TERM_STOP_PCT || '0.20' }}
          LONG_TERM_DD_CAUTION: ${{ vars.LONG_TERM_DD_CAUTION || '0.25' }}
          LONG_TERM_DD_ALERT: ${{ vars.LONG_TERM_DD_ALERT || '0.35' }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TZ: Asia/Shanghai
        run: |
          mkdir -p data logs reports
          python scripts/discover.py
